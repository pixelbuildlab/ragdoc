services:
  client:
    build: ./client
    container_name: vite_react_app
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      - ./client/src/:/app/src
    depends_on:
      - server
  server:
    build: ./server
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./server/app:/app/app
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg18-bookworm
    restart: always
    ports:
      - 5432:5432
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - ./server/db-data/:/var/lib/postgresql/
  inngest:
    image: inngest/inngest:latest
    command: "inngest dev -u http://server:8000/api/inngest"
    ports:
      - "8288:8288"
      - "8289:8289"
    depends_on:
      - server

volumes:
  qdrant_storage:
  db-data:
